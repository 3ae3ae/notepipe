name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >
        How it could work. notepipe keeps its core small and neutral (see docs/design.md); if the idea depends on a
        particular website, vendor or model, consider whether it fits an adapter, a stage prompt or the completion hook.
