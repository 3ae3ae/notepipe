name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish after every build passes (for example v0.1.0)'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, tomllib
          root = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['VERSION'] == 'v' + root, root
          PYCODE

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: notepipe-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: notepipe-linux-aarch64
          - os: macos-26
            target: aarch64-apple-darwin
            asset: notepipe-macos-arm64
          - os: macos-26
            target: x86_64-apple-darwin
            asset: notepipe-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: notepipe-windows-x86_64.exe
            exe: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Collect binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/notepipe${{ matrix.exe && '.exe' || '' }}" "${{ matrix.asset }}"

      - uses: ./.github/actions/macos-signing
        if: runner.os == 'macOS'
        with:
          certificate: ${{ secrets.MACOS_CERT_P12 }}
          password: ${{ secrets.MACOS_CERT_PASS }}

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        run: |
          # Without a certificate, sign ad hoc: unsigned arm64 binaries are killed on launch.
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp -s "$APPLE_SIGNING_IDENTITY" "${{ matrix.asset }}"
          else
            codesign --force --sign - "${{ matrix.asset }}"
          fi
          codesign --verify --verbose=2 "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build core wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ runner.os == 'Linux' && '2_28' || 'auto' }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: package-core-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Remove signing material
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain" 2>/dev/null || true

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: package-core-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  speech-swift-adapter:
    needs: validate
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    defaults:
      run:
        working-directory: adapters/speech-swift
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: adapters/speech-swift
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build speech-swift adapter
        run: cargo build --release --locked --target aarch64-apple-darwin
      - uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.MACOS_CERT_P12 }}
          password: ${{ secrets.MACOS_CERT_PASS }}
      - name: Sign speech-swift adapter
        run: |
          binary=target/aarch64-apple-darwin/release/notepipe-asr-speech-swift
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp -s "$APPLE_SIGNING_IDENTITY" "$binary"
          else
            codesign --force --sign - "$binary"
          fi
          codesign --verify --verbose=2 "$binary"
      - name: Stage MLX runtime asset and release archive
        run: |
          mkdir -p wheel-data/scripts dist
          cp target/aarch64-apple-darwin/release/mlx.metallib wheel-data/scripts/mlx.metallib
          tar -czf dist/notepipe-asr-speech-swift-macos-arm64.tar.gz \
            -C target/aarch64-apple-darwin/release notepipe-asr-speech-swift mlx.metallib
      - name: Build speech-swift wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: adapters/speech-swift
          target: aarch64-apple-darwin
          args: --release --locked --out dist --compatibility pypi
      - name: Verify wheel runtime files
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              files = wheel.namelist()
              for name in ('notepipe-asr-speech-swift', 'mlx.metallib'):
                  assert any(path.endswith('.data/scripts/' + name) for path in files), files
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: package-speech-swift-wheel
          path: adapters/speech-swift/dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: notepipe-asr-speech-swift-macos-arm64
          path: adapters/speech-swift/dist/*.tar.gz
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain" 2>/dev/null || true

  python-adapters:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [llama, meta, openvino, xai, ytdlp]
    steps:
      - uses: actions/checkout@v4
      - name: Find adapter
        id: adapter
        shell: bash
        run: |
          if [ -f "adapters/${{ matrix.adapter }}/pyproject.toml" ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.adapter.outputs.exists == 'true'
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        if: steps.adapter.outputs.exists == 'true'
        working-directory: adapters/${{ matrix.adapter }}
        run: uv build
      - uses: actions/upload-artifact@v4
        if: steps.adapter.outputs.exists == 'true'
        with:
          name: package-${{ matrix.adapter }}
          path: adapters/${{ matrix.adapter }}/dist/*
          if-no-files-found: error

  release:
    needs: [build, sdist, speech-swift-adapter, python-adapters]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          make_latest: ${{ !contains(env.VERSION, '-') }}

  pypi:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifacts: package-core-*, environment: pypi }
          - { artifacts: package-speech-swift-*, environment: pypi-notepipe-asr-speech-swift }
          - { artifacts: package-llama, environment: pypi-notepipe-asr-llama }
          - { artifacts: package-meta, environment: pypi-notepipe-asr-meta }
          - { artifacts: package-openvino, environment: pypi-notepipe-asr-openvino }
          - { artifacts: package-xai, environment: pypi-notepipe-asr-xai }
          - { artifacts: package-ytdlp, environment: pypi-notepipe-source-ytdlp }
    # PyPI allows one pending trusted publisher per environment, so each project publishes from its own.
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.artifacts }}
          path: dist
          merge-multiple: true
      - name: Publish Python packages
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Adapters are versioned independently; versions already on PyPI are left as they are.
          skip-existing: true
