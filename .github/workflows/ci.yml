name: ci

# main only changes through pull requests that pass this workflow while up to date with main, so a merge needs no
# second test run: a push to main runs no jobs and only records main's status, which the README badge shows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decide which jobs this change needs: code and build files, not READMEs. A manual run or a change to this file
  # runs everything; a push to main runs nothing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.core == 'true' }}
      speech_swift: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.speech_swift == 'true' }}
      python: ${{ github.event_name == 'workflow_dispatch' && '["llama","meta","openvino","sensevoice","xai","ytdlp"]' || steps.adapters.outputs.changes || '[]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        if: github.event_name == 'pull_request'
        with:
          filters: |
            core: [src/**, tests/**, Cargo.toml, Cargo.lock, .github/workflows/ci.yml]
            speech_swift: ['adapters/speech-swift/{src,native}/**', 'adapters/speech-swift/{Cargo.toml,Cargo.lock,build.rs}', .github/workflows/ci.yml]
      - uses: dorny/paths-filter@v3
        id: adapters
        if: github.event_name == 'pull_request'
        with:
          filters: |
            llama: ['adapters/llama/{src,tests}/**', 'adapters/llama/{pyproject.toml,uv.lock}', .github/workflows/ci.yml]
            meta: ['adapters/meta/{src,tests}/**', 'adapters/meta/{pyproject.toml,uv.lock}', .github/workflows/ci.yml]
            openvino: ['adapters/openvino/{src,tests}/**', 'adapters/openvino/{pyproject.toml,uv.lock}', .github/workflows/ci.yml]
            sensevoice: ['adapters/sensevoice/{src,tests}/**', 'adapters/sensevoice/{pyproject.toml,uv.lock}', .github/workflows/ci.yml]
            xai: ['adapters/xai/{src,tests}/**', 'adapters/xai/{pyproject.toml,uv.lock}', .github/workflows/ci.yml]
            ytdlp: ['adapters/ytdlp/{src,tests}/**', 'adapters/ytdlp/{pyproject.toml,uv.lock}', .github/workflows/ci.yml]

  test:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The tests start Python fixture adapters; a set-up interpreter starts quickly on every runner.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests (task protocol, CLI)
        run: cargo test --test cli_ux --test task_execution

      - name: Integration tests (synthetic video)
        if: runner.os != 'Windows'
        run: cargo test --features integration --test scene_synthetic

  speech-swift-adapter:
    needs: changes
    if: needs.changes.outputs.speech_swift == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: adapters/speech-swift
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: adapters/speech-swift
      # Building MLX and the other Swift packages takes most of this job; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: adapters/speech-swift/native/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('adapters/speech-swift/native/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  python-adapters:
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJSON(needs.changes.outputs.python) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Tests
        working-directory: adapters/${{ matrix.adapter }}
        run: uv run --with pytest pytest
      - name: Build wheel and sdist
        working-directory: adapters/${{ matrix.adapter }}
        run: uv build

  # The one required check: it passes when every job above passed or was not needed.
  ci:
    if: always()
    needs: [changes, test, speech-swift-adapter, python-adapters]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
