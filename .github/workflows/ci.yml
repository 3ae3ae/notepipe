name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests (task protocol, CLI)
        run: cargo test --test cli_ux --test task_execution

      - name: Integration tests (synthetic video)
        if: runner.os != 'Windows'
        run: cargo test --features integration --test scene_synthetic

  apple-adapter:
    runs-on: macos-26
    defaults:
      run:
        working-directory: adapters/apple
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: adapters/apple
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  python-adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [llama, meta, openvino, xai, ytdlp]
    steps:
      - uses: actions/checkout@v4
      - name: Find adapter
        id: adapter
        shell: bash
        run: |
          if [ -f "adapters/${{ matrix.adapter }}/pyproject.toml" ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.adapter.outputs.exists == 'true'
        with:
          python-version: '3.12'
      - name: Tests
        if: steps.adapter.outputs.exists == 'true'
        working-directory: adapters/${{ matrix.adapter }}
        run: uv run --with pytest pytest
      - name: Build wheel and sdist
        if: steps.adapter.outputs.exists == 'true'
        working-directory: adapters/${{ matrix.adapter }}
        run: uv build

