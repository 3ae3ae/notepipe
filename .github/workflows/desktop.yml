name: native desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'native/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/actions/**'
      - '.github/workflows/desktop.yml'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-deps
        with:
          # PRs build the frozen revisions; a manual run tracks upstream main.
          locked: ${{ github.event_name == 'pull_request' }}
      - name: Check and test desktop
        run: cargo test --manifest-path desktop/Cargo.toml
      - name: Build development binaries
        run: |
          cargo build
          cargo build --manifest-path desktop/Cargo.toml
      - name: Free compiler intermediates before creating the disk image
        if: runner.os == 'macOS'
        run: |
          rm -rf target/debug/deps target/debug/incremental desktop/target/debug/deps desktop/target/debug/incremental
          df -h .
      - name: Package development build
        run: python desktop/scripts/package.py --debug --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: course2md-desktop-${{ runner.os }}
          path: |
            desktop/target/packages/*.zip
            desktop/target/packages/*.tar.gz
            desktop/target/packages/*.dmg
