name: packaging

on:
  push:
    branches: [main]
    paths: ['packaging/**', 'install.sh', '.github/workflows/packaging.yml']
  pull_request:
    paths: ['packaging/**', 'install.sh', '.github/workflows/packaging.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck --severity=error install.sh
