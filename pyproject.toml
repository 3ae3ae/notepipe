[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "notepipe"
dynamic = ["version"]
description = "Extensible engine and CLI that turns video and audio into Markdown notes"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
# Official adapters, one extra each: notepipe[ytdlp,llama].
ytdlp = ["notepipe-source-ytdlp"]
llama = ["notepipe-asr-llama"]
openvino = ["notepipe-asr-openvino"]
speech-swift = ["notepipe-asr-speech-swift"]
xai = ["notepipe-asr-xai"]
meta = ["notepipe-asr-meta"]

[project.urls]
Homepage = "https://github.com/3ae3ae/notepipe"
Repository = "https://github.com/3ae3ae/notepipe"
Issues = "https://github.com/3ae3ae/notepipe/issues"

[tool.maturin]
bindings = "bin"
