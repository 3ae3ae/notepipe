[package]
name = "notepipe-asr-speech-swift"
version = "0.1.0"
edition = "2024"
description = "Speech recognition adapter for notepipe on Apple silicon, using speech-swift (MLX and Core ML)"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"
