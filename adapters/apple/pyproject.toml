[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "notepipe-asr-apple"
dynamic = ["version"]
description = "Apple silicon HTTP transcription adapter for notepipe"
requires-python = ">=3.9"
license = "MIT"
classifiers = ["Operating System :: MacOS :: MacOS X"]

[project.urls]
Repository = "https://github.com/3ae3ae/notepipe"

[tool.maturin]
bindings = "bin"
data = "wheel-data"

[tool.maturin.target.aarch64-apple-darwin]
macos-deployment-target = "15.0"
