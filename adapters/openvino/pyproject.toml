[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "notepipe-asr-openvino"
version = "0.1.0"
description = "OpenVINO HTTP transcription adapter for notepipe"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["openvino-genai>=2025.4", "numpy>=1.26", "huggingface-hub>=0.27"]

[project.scripts]
notepipe-asr-openvino = "notepipe_asr_openvino:main"
