[package]
name = "notepipe"
version = "0.4.6"
edition = "2024"
rust-version = "1.89"
description = "Extensible engine and CLI that turns video and audio into Markdown notes"
repository = "https://github.com/3ae3ae/notepipe"
license = "MIT"
readme = "README.md"
keywords = ["transcription", "markdown", "notes", "speech-to-text", "cli"]
categories = ["command-line-utilities", "multimedia::audio", "multimedia::video"]
# Adapters are packaged separately.
exclude = [".github/", "adapters/"]

[dependencies]
earshot = "1.2.2"
anyhow = "1"
tempfile = "3"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
getrandom = "0.2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.17"
image-compare = "0.5.0"
libc = "0.2"
dialoguer = "0.12.0"
unicode-general-category = "1"
unicode-segmentation = "1"
which = "8.0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true

[features]
integration = []
